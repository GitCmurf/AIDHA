theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: orange
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - def_list
  - attr_list
  - tables
  - codehilite
plugins:
  - search
  - macros
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      strict: false
exclude_docs: |
  **/WIP-*.md
extra:
  version:
    provider: false
watch:
  - docs
